server:
  port: 8888

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 你的mysql密码
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 900MB
      max-request-size: 900MB
  web:
    resources:
      static-locations: classpath:/static/,file:D:/pet_upload/avatar/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto